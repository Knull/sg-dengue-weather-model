name: Dengue baseline audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install baseline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn h3
      - name: Run last-week baselines
        run: |
          python scripts/evaluate_last_week_baseline.py --out results/last_week_baseline.csv
      - name: Show result
        run: cat results/last_week_baseline.csv
      - uses: actions/upload-artifact@v4
        with:
          name: last-week-baseline
          path: results/last_week_baseline.csv
